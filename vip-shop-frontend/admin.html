<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Shop - Secure Admin Panel</title>
    <link rel="icon" type="image/png" href="favico.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        
        /* LOGIN SCREEN */
        .login-container { max-width: 400px; margin: 100px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .login-container h1 { color: #333; margin-bottom: 10px; text-align: center; font-size: 24px; }
        .login-container p { color: #999; text-align: center; margin-bottom: 30px; font-size: 13px; }
        .login-form { display: flex; flex-direction: column; gap: 15px; }
        .login-form input { padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
        .login-form button { padding: 12px; background: #667eea; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: background 0.3s; }
        .login-form button:hover { background: #764ba2; }
        .login-status { text-align: center; margin-top: 15px; font-size: 14px; }
        .login-status.error { color: #ef4444; }
        .login-status.success { color: #10b981; }
        
        /* ADMIN PANEL */
        .admin-panel { display: none; }
        .header { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); margin-bottom: 30px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { color: #333; font-size: 28px; }
        .header-buttons { display: flex; gap: 10px; }
        .logout-btn { padding: 10px 20px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .logout-btn:hover { background: #dc2626; }
        
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); text-align: center; }
        .stat-card h3 { color: #999; font-size: 12px; font-weight: normal; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .stat-card .number { font-size: 32px; font-weight: bold; color: #667eea; }
        
        .orders-section { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); }
        .orders-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #eee; }
        .orders-header h2 { color: #333; font-size: 20px; }
        .filter-buttons { display: flex; gap: 10px; }
        .filter-btn { padding: 8px 16px; border: 2px solid #ddd; background: white; color: #333; border-radius: 5px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
        .filter-btn.active { background: #667eea; color: white; border-color: #667eea; }
        .filter-btn:hover { border-color: #667eea; }
        
        .orders-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .orders-table thead { background: #f8f9fa; }
        .orders-table th { padding: 15px; text-align: left; font-weight: bold; color: #333; border-bottom: 2px solid #ddd; }
        .orders-table td { padding: 15px; border-bottom: 1px solid #eee; color: #666; }
        .orders-table tbody tr:hover { background: #f8f9fa; }
        
        .status-badge { display: inline-block; padding: 5px 12px; border-radius: 15px; font-size: 12px; font-weight: bold; color: white; }
        .status-badge.pending { background: #fbbf24; }
        .status-badge.approved { background: #60a5fa; }
        .status-badge.completed { background: #10b981; }
        .status-badge.rejected { background: #ef4444; }
        
        .action-buttons { display: flex; gap: 8px; flex-wrap: wrap; }
        .action-btn { padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; transition: all 0.3s; color: white; }
        .action-btn.approve { background: #60a5fa; }
        .action-btn.approve:hover { background: #3b82f6; }
        .action-btn.finish { background: #10b981; }
        .action-btn.finish:hover { background: #059669; }
        .action-btn.reject { background: #ef4444; }
        .action-btn.reject:hover { background: #dc2626; }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .empty-state { text-align: center; padding: 40px; color: #999; }
        .loading { text-align: center; padding: 40px; color: #667eea; font-size: 18px; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- LOGIN SCREEN -->
    <div class="login-container" id="loginContainer">
        <h1>🔐 Admin Panel</h1>
        <p>Sichere Authentifizierung mit JWT-Token</p>
        <div class="login-form">
            <input type="password" id="adminSecret" placeholder="Admin Secret eingeben..." autocomplete="off" />
            <button onclick="loginAdmin()">Anmelden</button>
        </div>
        <div id="loginStatus" class="login-status"></div>
    </div>

    <!-- ADMIN PANEL -->
    <div class="admin-panel" id="adminPanel">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <h1>🛡️ Admin Panel</h1>
                <div class="header-buttons">
                    <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
                </div>
            </div>

            <!-- Stats -->
            <div class="stats">
                <div class="stat-card">
                    <h3>Insgesamt</h3>
                    <div class="number" id="statTotal">0</div>
                </div>
                <div class="stat-card">
                    <h3>Ausstehend</h3>
                    <div class="number" id="statPending">0</div>
                </div>
                <div class="stat-card">
                    <h3>Genehmigt</h3>
                    <div class="number" id="statApproved">0</div>
                </div>
                <div class="stat-card">
                    <h3>Fertig</h3>
                    <div class="number" id="statCompleted">0</div>
                </div>
            </div>

            <!-- Orders -->
            <div class="orders-section">
                <div class="orders-header">
                    <h2>Bestellungen</h2>
                    <div class="filter-buttons">
                        <button class="filter-btn active" onclick="filterOrders('all')">Alle</button>
                        <button class="filter-btn" onclick="filterOrders('pending')">Ausstehend</button>
                        <button class="filter-btn" onclick="filterOrders('approved')">Genehmigt</button>
                        <button class="filter-btn" onclick="filterOrders('completed')">Fertig</button>
                    </div>
                </div>
                <div id="ordersContent">
                    <div class="loading">Bestellungen werden geladen...</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE_URL = (window.location.hostname === 'localhost') ? 'http://localhost:3000' : 'https://api.vipshop.cloud';
        let authToken = null;
        let allOrders = [];
        let currentFilter = 'all';

        // Check if token exists on load
        window.onload = function() {
            const savedToken = localStorage.getItem('adminToken');
            if (savedToken) {
                authToken = savedToken;
                verifyTokenAndLoadPanel();
                // Start token check every 10 seconds
                startTokenCheckInterval();
            }
        };

        // Check token validity every 10 seconds
        let tokenCheckInterval = null;
        function startTokenCheckInterval() {
            tokenCheckInterval = setInterval(() => {
                if (authToken) {
                    verifyTokenValidity();
                }
            }, 10000); // Check every 10 seconds
        }

        async function verifyTokenValidity() {
            try {
                const response = await fetch(API_BASE_URL + '/api/admin/verify', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });

                if (!response.ok) {
                    // Token expired or invalid
                    clearInterval(tokenCheckInterval);
                    localStorage.removeItem('adminToken');
                    authToken = null;
                    showLoginScreen();
                    showLoginStatus('Token abgelaufen - Bitte neu anmelden', true);
                }
            } catch (error) {
                console.error('Token verification error:', error);
            }
        }

        async function verifyTokenAndLoadPanel() {
            try {
                const response = await fetch(API_BASE_URL + '/api/admin/verify', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });

                if (response.ok) {
                    showAdminPanel();
                    loadOrders();
                } else {
                    localStorage.removeItem('adminToken');
                    authToken = null;
                    showLoginScreen();
                }
            } catch (error) {
                console.error('Verification error:', error);
                showLoginScreen();
            }
        }

        function showLoginStatus(message, isError = false) {
            const status = document.getElementById('loginStatus');
            status.textContent = message;
            status.className = 'login-status' + (isError ? ' error' : ' success');
        }

        async function loginAdmin() {
            const secret = document.getElementById('adminSecret').value.trim();
            if (!secret) {
                showLoginStatus('Bitte Admin Secret eingeben', true);
                return;
            }

            try {
                const response = await fetch(API_BASE_URL + '/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ secret })
                });

                const data = await response.json();

                if (!response.ok) {
                    showLoginStatus(data.error || 'Anmeldung fehlgeschlagen', true);
                    return;
                }

                authToken = data.token;
                localStorage.setItem('adminToken', authToken);
                showLoginStatus('✓ Anmeldung erfolgreich!');
                startTokenCheckInterval();
                setTimeout(() => {
                    showAdminPanel();
                    loadOrders();
                }, 500);
            } catch (error) {
                console.error('Login error:', error);
                showLoginStatus('Fehler beim Verbinden', true);
            }
        }

        function showAdminPanel() {
            document.getElementById('loginContainer').style.display = 'none';
            document.getElementById('adminPanel').style.display = 'block';
        }

        function showLoginScreen() {
            document.getElementById('loginContainer').style.display = 'block';
            document.getElementById('adminPanel').style.display = 'none';
        }

        async function loadOrders() {
            if (!authToken) return;

            try {
                const response = await fetch(API_BASE_URL + '/api/admin/orders', {
                    headers: { 'Authorization': 'Bearer ' + authToken }
                });

                if (!response.ok) {
                    if (response.status === 401) {
                        localStorage.removeItem('adminToken');
                        showLoginScreen();
                    }
                    return;
                }

                const data = await response.json();
                allOrders = data.orders || [];
                updateStats();
                renderOrders();
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('ordersContent').innerHTML = '<div class="empty-state">Fehler beim Laden der Bestellungen</div>';
            }
        }

        function updateStats() {
            document.getElementById('statTotal').textContent = allOrders.length;
            document.getElementById('statPending').textContent = allOrders.filter(o => o.status === 'pending').length;
            document.getElementById('statApproved').textContent = allOrders.filter(o => o.status === 'approved').length;
            document.getElementById('statCompleted').textContent = allOrders.filter(o => o.status === 'completed').length;
        }

        function filterOrders(status) {
            currentFilter = status;
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderOrders();
        }

        function renderOrders() {
            const filtered = currentFilter === 'all' ? allOrders : allOrders.filter(o => o.status === currentFilter);
            const ordersContent = document.getElementById('ordersContent');

            if (filtered.length === 0) {
                ordersContent.innerHTML = '<div class="empty-state">Keine Bestellungen gefunden</div>';
                return;
            }

            let html = '<table class="orders-table"><thead><tr><th>Produkt</th><th>Telegram</th><th>Email</th><th>Status</th><th>Datum</th><th>Aktionen</th></tr></thead><tbody>';

            filtered.forEach(order => {
                const date = new Date(order.created_at).toLocaleDateString('de-DE');
                html += `<tr>
                    <td>${order.product_name}</td>
                    <td><strong>${order.telegram_username}</strong></td>
                    <td>${order.customer_email}</td>
                    <td><span class="status-badge ${order.status}">${order.status}</span></td>
                    <td>${date}</td>
                    <td><div class="action-buttons">${getActionButtons(order)}</div></td>
                </tr>`;
            });

            html += '</tbody></table>';
            ordersContent.innerHTML = html;
        }

        function getActionButtons(order) {
            let buttons = '';

            if (order.status === 'pending') {
                buttons += `<button class="action-btn approve" onclick="approveOrder('${order.id}')">Genehmigen</button>`;
                buttons += `<button class="action-btn reject" onclick="rejectOrder('${order.id}')">Ablehnen</button>`;
            }

            if (order.status === 'approved') {
                buttons += `<button class="action-btn finish" onclick="finishOrder('${order.id}')">Fertig</button>`;
                buttons += `<button class="action-btn reject" onclick="rejectOrder('${order.id}')">Ablehnen</button>`;
            }

            if (!buttons) {
                buttons = `<span style="color: #999; font-size: 12px;">Keine Aktionen</span>`;
            }

            return buttons;
        }

        async function approveOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            const confirmed = confirm(`Bestellung "${order.product_name}" wirklich genehmigen?`);
            if (!confirmed) return;

            try {
                const response = await fetch(API_BASE_URL + `/api/admin/approve/${orderId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: order.code })
                });

                if (response.ok) {
                    alert('Bestellung genehmigt!');
                    loadOrders();
                } else {
                    alert('Fehler beim Genehmigen');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Fehler beim Genehmigen');
            }
        }

        async function rejectOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            const reason = prompt(`Bestellung "${order.product_name}" ablehnen. Grund:`);
            if (!reason) return;

            try {
                const response = await fetch(API_BASE_URL + `/api/admin/reject/${orderId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ reason })
                });

                if (response.ok) {
                    alert('Bestellung abgelehnt!');
                    loadOrders();
                } else {
                    alert('Fehler beim Ablehnen');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Fehler beim Ablehnen');
            }
        }

        async function finishOrder(orderId) {
            const order = allOrders.find(o => o.id === orderId);
            if (!order) return;

            const confirmed = confirm(`Bestellung "${order.product_name}" abschließen?`);
            if (!confirmed) return;

            try {
                const response = await fetch(API_BASE_URL + `/api/admin/finish/${orderId}`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + authToken,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ code: order.code })
                });

                if (response.ok) {
                    alert('Bestellung abgeschlossen!');
                    loadOrders();
                } else {
                    alert('Fehler beim Abschließen');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Fehler beim Abschließen');
            }
        }

        function logoutAdmin() {
            const confirmed = confirm('Wirklich abmelden?');
            if (confirmed) {
                clearInterval(tokenCheckInterval);
                localStorage.removeItem('adminToken');
                authToken = null;
                document.getElementById('adminSecret').value = '';
                showLoginScreen();
            }
        }
    </script>
</body>
</html>
